<!DOCTYPE html>
<html lang="ja">

<head>

    <title>Limerick Living Map</title>

    <!-- 自分のCSS -->
    <link rel="stylesheet" href="map.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Font Awesome CSS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>

<body>
   
    <!-- 地図表示エリア。必ずbodyの中に置く -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // CSS変数からアイコンサイズを取得
        const rootStyle = getComputedStyle(document.documentElement);
        const iconSize = parseInt(rootStyle.getPropertyValue('--marker-size'));

        // 地図をThomond Student Village中心に表示
        const map = L.map('map').setView(
            [52.682556, -8.659160],
            15
        );
        const homeControl = L.control({
            position: 'topright'
        });
        
        homeControl.onAdd = function () {
        
            const div = L.DomUtil.create(
                'div',
                'leaflet-home-button'
            );
        
            div.innerHTML = `
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                </a>
            `;
        
            return div;
        };
        
        homeControl.addTo(map);

        // OpenStreetMapの地図タイル
        L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);

        // Font Awesomeアイコンを作る関数
        function createIcon(iconClass, cssClass) {
            return L.divIcon({
                html: `<i class="${iconClass}"></i>`,
                className: cssClass,
                iconSize: [iconSize, iconSize],
                iconAnchor: [iconSize / 2, iconSize],
                popupAnchor: [0, -iconSize]
            });
        }

        // アイコン定義
        const homeIcon = createIcon(
            'fa-solid fa-house',
            'map-icon home-icon'
        );

        const supermarketIcon = createIcon(
            'fa-solid fa-cart-shopping',
            'map-icon supermarket-icon'
        );

        const shoppingcentreIcon = createIcon(
            'fa-solid fa-city',
            'map-icon shoppingcentre-icon'
        );

        const convenienceIcon = createIcon(
            'fa-solid fa-store',
            'map-icon convenience-icon'
        );

        const pharmacyIcon = createIcon(
            'fa-solid fa-capsules',
            'map-icon pharmacy-icon'
        );
        
        const cafeIcon = createIcon(
            'fa-solid fa-mug-hot',
            'map-icon cafe-icon'
        );

        const restaurantIcon = createIcon(
            'fa-solid fa-utensils',
            'map-icon restaurant-icon'
        );

        const burgerIcon = createIcon(
            'fa-solid fa-burger',
            'map-icon burger-icon'
        );

        );

            'map-icon gs-icon'

        const parkIcon = createIcon(
            'fa-solid fa-tree',
            'map-icon park-icon'
        );

        const fieldIcon = createIcon(
            'fa-solid fa-compact-disc',
            'map-icon field-icon'
        );

        const hotelIcon = createIcon(
            'fa-solid fa-hotel',
            'map-icon hotelIcon'
        );
        
        // Thomond Student Village
        L.marker(
            [52.682556, -8.659160],

            Thomond student villge
        `);

        // スーパーマーケット
