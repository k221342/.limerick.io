<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>

    <link rel="stylesheet" href="weather.css">
</head>

<body>

    <div class="container">

        <div class="header">

            <h1>
                🇮🇪 Limerick Weather
            </h1>

        </div>

        <div id="todayWeather"></div>

        <div id="weatherGrid" class="weather-grid">

            <div class="loading">
                天気情報を取得中...
            </div>

        </div>

        <a href="index.html" class="home-link">
            ← Homeへ戻る
        </a>

    </div>

    <script>

        const LATITUDE = 52.67418731232117;
        const LONGITUDE = -8.571933345030319;

        const DISPLAY_HOURS = [
            "06",
            "09",
            "12",
            "15",
            "18"
        ];

        const weatherCodeMap = {

            0: ["☀️", "Clear"],
            1: ["🌤️", "Mainly Clear"],
            2: ["⛅", "Partly Cloudy"],
            3: ["☁️", "Cloudy"],
            45: ["🌫️", "Fog"],
            48: ["🌫️", "Fog"],
            51: ["🌦️", "Drizzle"],
            53: ["🌦️", "Rain"],
            55: ["🌧️", "Heavy Rain"],
            61: ["🌧️", "Rain"],
            63: ["🌧️", "Rain"],
            65: ["🌧️", "Heavy Rain"],
            71: ["❄️", "Snow"],
            80: ["🌦️", "Showers"],
            81: ["🌧️", "Rain"],
            82: ["🌧️", "Heavy Rain"],
            95: ["⛈️", "Thunderstorm"]

        };

        const weekdays = [
            "Sun",
            "Mon",
            "Tue",
            "Wed",
            "Thu",
            "Fri",
            "Sat"
        ];

        async function loadWeather() {

            const url =
                "https://api.open-meteo.com/v1/forecast" +
                "?latitude=" + LATITUDE +
                "&longitude=" + LONGITUDE +
                "&current=temperature_2m,weather_code,wind_speed_10m" +
                "&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max" +
                "&hourly=weather_code,wind_speed_10m,temperature_2m,uv_index" +
                "&wind_speed_unit=kmh" +
                "&timezone=auto";

            try {

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("天気情報の取得に失敗しました");
                }

                const data = await response.json();

                const grid =
                    document.getElementById("weatherGrid");

                const todayContainer =
                    document.getElementById("todayWeather");

                grid.innerHTML = "";
                todayContainer.innerHTML = "";

                const dates =
                    data.daily.time;

                const current =
                    data.current;

                const maxTemps =
                    data.daily.temperature_2m_max;

                const minTemps =
                    data.daily.temperature_2m_min;

                const dailyUvMax =
                    data.daily.uv_index_max;

                const hourlyTimes =
                    data.hourly.time;

                const hourlyCodes =
                    data.hourly.weather_code;

                const hourlyWind =
                    data.hourly.wind_speed_10m;

                const hourlyTemp =
                    data.hourly.temperature_2m;

                const hourlyUv =
                    data.hourly.uv_index;

                function formatDate(dateText) {

                    const d =
                        new Date(dateText);

                    return `${d.getMonth() + 1}/${d.getDate()} (${weekdays[d.getDay()]})`;

                }

                function getHourlyIndex(date, hour) {

                    const target =
                        `${date}T${hour}:00`;

                    return hourlyTimes.indexOf(target);

                }

                function getHourlyIcon(date, hour) {

                    const index =
                        getHourlyIndex(date, hour);

                    if (index < 0) {
                        return "❓";
                    }

                    return (
                        weatherCodeMap[
                            hourlyCodes[index]
                        ] || ["❓"]
                    )[0];

                }

                function getHourlyWind(date, hour) {

                    const index =
                        getHourlyIndex(date, hour);

                    if (index < 0) {
                        return "-";
                    }

                    return (
                        hourlyWind[index] / 3.6
                    ).toFixed(1);

                }

                function getHourlyTemp(date, hour) {

                    const index =
                        getHourlyIndex(date, hour);

                    if (index < 0) {
                        return "-";
                    }

                    return Math.round(
                        hourlyTemp[index]
                    );

                }

                function getTempColor(temp) {

                    const value =
                        Number(temp);

                    if (!Number.isFinite(value)) {
                        return "#777777";
                    }

                    if (value <= 10) {
                        return "#1d6fd7";
                    }

                    if (value <= 15) {
                        return "#4b8cff";
                    }

                    if (value <= 20) {
                        return "#ff9800";
                    }

                    return "#e53935";

                }

                function getUvInfo(uvValue) {

                    const value =
                        Number(uvValue);

                    if (!Number.isFinite(value)) {
                        return {
                            level: "UNKNOWN",
                            label: "UV情報なし",
                            message: "日焼け対策情報なし",
                            className: "uv-unknown"
                        };
                    }

                    if (value <= 2) {
                        return {
                            level: "LOW",
                            label: "低い",
                            message: "ほぼ心配なし",
                            className: "uv-low"
                        };
                    }

                    if (value <= 5) {
                        return {
                            level: "MODERATE",
                            label: "中程度",
                            message: "日焼け止め推奨",
                            className: "uv-moderate"
                        };
                    }

                    if (value <= 7) {
                        return {
                            level: "HIGH",
                            label: "高い",
                            message: "日焼け対策必須",
                            className: "uv-high"
                        };
                    }

                    if (value <= 10) {
                        return {
                            level: "VERY HIGH",
                            label: "非常に高い",
                            message: "長時間屋外注意",
                            className: "uv-very-high"
                        };
                    }

                    return {
                        level: "EXTREME",
                        label: "極端に高い",
                        message: "日陰推奨",
                        className: "uv-extreme"
                    };

                }

                function getUvPeakTime(date) {

                    let maxUv =
                        -1;

                    let peakTime =
                        "";

                    for (let i = 0; i < hourlyTimes.length; i++) {

                        if (!hourlyTimes[i].startsWith(date)) {
                            continue;
                        }

                        const uv =
                            Number(hourlyUv[i]);

                        if (!Number.isFinite(uv)) {
                            continue;
                        }

                        if (uv > maxUv) {
                            maxUv = uv;
                            peakTime = hourlyTimes[i].slice(11, 16);
                        }

                    }

                    return peakTime;

                }

                function createRow(label, valuesHtml, rowClass) {

                    return `
                        <div class="today-row ${rowClass}">
                            <div class="row-label">${label}</div>
                            <div class="row-values">
                                ${valuesHtml}
                            </div>
                        </div>
                    `;

                }

                function createCurrentWeatherRow() {

                    const currentIcon =
                        (
                            weatherCodeMap[
                                current.weather_code
                            ] || ["❓"]
                        )[0];

                    return `
                        <div class="current-weather-row">

                            <div class="current-time">
                                <span class="current-label">🕒</span>
                                <span class="current-value">
                                    今の天気
                                </span>
                            </div>

                            <div class="current-main">
                                <span class="current-icon">
                                    ${currentIcon}
                                </span>

                                <span class="current-temp"
                                      style="color:${getTempColor(current.temperature_2m)}">
                                    ${Math.round(current.temperature_2m)}°
                                </span>
                            </div>

                            <div class="current-wind">
                                <span class="current-label">💨</span>
                                <span class="current-value">
                                    ${(current.wind_speed_10m / 3.6).toFixed(1)} m/s
                                </span>
                            </div>

                        </div>
                    `;

                }

                function createWeatherDetailCard(date, index, isToday) {

                    const formattedDate =
                        formatDate(date);

                    const title =
                        isToday ?
                            `TODAY ${formattedDate}` :
                            formattedDate;

                    const timeValues =
                        DISPLAY_HOURS.map(function (hour) {
                            return `<span>${Number(hour)}</span>`;
                        }).join("");

                    const weatherValues =
                        DISPLAY_HOURS.map(function (hour) {
                            return `<span>${getHourlyIcon(date, hour)}</span>`;
                        }).join("");

                    const tempValues =
                        DISPLAY_HOURS.map(function (hour) {

                            const temp =
                                getHourlyTemp(date, hour);

                            return `
                                <span style="color:${getTempColor(temp)}">
                                    ${temp}°
                                </span>
                            `;

                        }).join("");

                    const windValues =
                        DISPLAY_HOURS.map(function (hour) {
                            return `<span>${getHourlyWind(date, hour)}</span>`;
                        }).join("");

                    const uvValue =
                        dailyUvMax[index];

                    const uvInfo =
                        getUvInfo(uvValue);

                    const uvPeakTime =
                        getUvPeakTime(date);

                    const uvPeakTimeText =
                        uvPeakTime === "" ?
                            "" :
                            `<span class="uv-time">Peak ${uvPeakTime}</span>`;

                    return `

                        <div class="${isToday ? "today-card" : "weather-card detail-weather-card"}">

                            <div class="${isToday ? "today-title" : "date"}">
                                ${title}
                            </div>

                            ${isToday ? createCurrentWeatherRow() : ""}

                            ${createRow("Time", timeValues, "time-row")}

                            ${createRow("Weather", weatherValues, "weather-row")}

                            ${createRow("Temp", tempValues, "temp-row")}

                            ${createRow("Wind (m/s)", windValues, "wind-row")}

                            <div class="uv-summary ${uvInfo.className}">

                                <div class="uv-main">
                                    <span class="uv-icon">☀️</span>
                                    <span class="uv-level">UV ${uvInfo.level}</span>
                                    <span class="uv-value">${Number(uvValue).toFixed(1)}</span>
                                </div>

                                <div class="uv-sub">
                                    ${uvPeakTimeText}
                                    <span class="uv-label">${uvInfo.label}</span>
                                </div>

                                <div class="uv-action">
                                    🧴 ${uvInfo.message}
                                </div>

                            </div>

                            <div class="today-temp-summary">

                                <span style="color:${getTempColor(maxTemps[index])}">
                                    ↑ ${Math.round(maxTemps[index])}°
                                </span>

                                <span style="color:${getTempColor(minTemps[index])}">
                                    ↓ ${Math.round(minTemps[index])}°
                                </span>

                            </div>

                        </div>
                    `;

                }

                todayContainer.innerHTML =
                    createWeatherDetailCard(
                        dates[0],
                        0,
                        true
                    );

                for (let i = 1; i < dates.length; i++) {

                    const card =
                        document.createElement("div");

                    card.innerHTML =
                        createWeatherDetailCard(
                            dates[i],
                            i,
                            false
                        );

                    grid.appendChild(
                        card.firstElementChild
                    );

                }

            } catch (error) {

                const grid =
                    document.getElementById("weatherGrid");

                grid.innerHTML = `
                    <div class="loading">
                        天気情報を取得できませんでした。時間をおいて再読み込みしてください。
                    </div>
                `;

                console.error(error);

            }

        }

        loadWeather();

    </script>

</body>

</html>
