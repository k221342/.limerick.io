<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>

    <link rel="stylesheet" href="weather.css">
</head>

<body>

    <div class="container">

        <div class="header">

            <h1>
                🇮🇪 Limerick Weather
            </h1>

        </div>

        <div id="todayWeather"></div>
        <div id="weatherGrid" class="weather-grid">

            <div class="loading">
                天気情報を取得中...
            </div>

        </div>

        <a href="index.html" class="home-link">
            ← Homeへ戻る
        </a>

    </div>

    <script>

        const LATITUDE = 52.682556;
        const LONGITUDE = -8.659160;

        const weatherCodeMap = {

            0: ["☀️", "Clear"],
            1: ["🌤️", "Mainly Clear"],
            2: ["⛅", "Partly Cloudy"],
            3: ["☁️", "Cloudy"],
            45: ["🌫️", "Fog"],
            48: ["🌫️", "Fog"],
            51: ["🌦️", "Drizzle"],
            53: ["🌦️", "Rain"],
            55: ["🌧️", "Heavy Rain"],
            61: ["🌧️", "Rain"],
            63: ["🌧️", "Rain"],
            65: ["🌧️", "Heavy Rain"],
            71: ["❄️", "Snow"],
            80: ["🌦️", "Showers"],
            81: ["🌧️", "Rain"],
            82: ["🌧️", "Heavy Rain"],
            95: ["⛈️", "Thunderstorm"]
        };

        const weekdays = [
            "Sun",
            "Mon",
            "Tue",
            "Wed",
            "Thu",
            "Fri",
            "Sat"
        ];

        async function loadWeather() {

            const url =
                "https://api.open-meteo.com/v1/forecast" +
                "?latitude=" + LATITUDE +
                "&longitude=" + LONGITUDE +
                "&daily=weather_code,temperature_2m_max,temperature_2m_min" +
                "&hourly=weather_code,wind_speed_10m,temperature_2m" +
                "&timezone=auto";
            
            const response = await fetch(url);

            const data = await response.json();

            const hourlyTemp =
                data.hourly.temperature_2m;

            const grid =
                document.getElementById("weatherGrid");

            grid.innerHTML = "";

            const todayContainer =
                document.getElementById(
                    "todayWeather"
                );

            const dates =
                data.daily.time;

            const maxTemps =
                data.daily.temperature_2m_max;

            const minTemps =
                data.daily.temperature_2m_min;

            const hourlyTimes =
                data.hourly.time;

            const hourlyCodes =
                data.hourly.weather_code;

            const hourlyWind =
                data.hourly.wind_speed_10m;
            
            const todayDate =
                dates[0];
            
            const todayObj =
                new Date(todayDate);
            
            const todayFormatted =
                `${todayObj.getMonth()+1}/${todayObj.getDate()} (${weekdays[todayObj.getDay()]})`;

            function getHourlyIcon(date, hour) {

                const target =
                    `${date}T${hour}:00`;

                const index =
                    hourlyTimes.indexOf(target);

                if(index < 0){
                    return "❓";
                }

                return (
                    weatherCodeMap[
                        hourlyCodes[index]
                    ] || ["❓"]
                )[0];
            }

            function getHourlyWind(date, hour){

                const target =
                    `${date}T${hour}:00`;

                const index =
                    hourlyTimes.indexOf(target);

                if(index < 0){
                    return "-";
                }

                return Math.round(
                    hourlyWind[index] / 3.6
                ).toFixed(1);
            }

            function getHourlyTemp(date, hour){

                const target =
                    `${date}T${hour}:00`;
            
                const index =
                    hourlyTimes.indexOf(target);
            
                if(index < 0){
                    return "-";
                }
            
                return Math.round(
                    hourlyTemp[index]
                );
            }

            todayContainer.innerHTML = `
            
                <div class="today-card">
            
                    <div class="today-title">
                        TODAY ${todayFormatted}
                    </div>
            
                    <div class="today-row">
                        <div class="row-label">Time</div>
                        <div class="row-values">
                            <span>06</span>
                            <span>09</span>
                            <span>12</span>
                            <span>15</span>
                            <span>18</span>
                        </div>
                    </div>
            
                    <div class="today-row">
                        <div class="row-label">Weather</div>
                        <div class="row-values">
                            <span>${getHourlyIcon(todayDate,"06")}</span>
                            <span>${getHourlyIcon(todayDate,"09")}</span>
                            <span>${getHourlyIcon(todayDate,"12")}</span>
                            <span>${getHourlyIcon(todayDate,"15")}</span>
                            <span>${getHourlyIcon(todayDate,"18")}</span>
                        </div>
                    </div>
            
                    <div class="today-row">
                        <div class="row-label">Temp</div>
                        <div class="row-values">
                            <span>${getHourlyTemp(todayDate,"06")}°</span>
                            <span>${getHourlyTemp(todayDate,"09")}°</span>
                            <span>${getHourlyTemp(todayDate,"12")}°</span>
                            <span>${getHourlyTemp(todayDate,"15")}°</span>
                            <span>${getHourlyTemp(todayDate,"18")}°</span>
                        </div>
                    </div>
            
                    <div class="today-row">
                        <div class="row-label">Wind (m/s)</div>
                        <div class="row-values">
                            <span>${getHourlyWind(todayDate,"06")}</span>
                            <span>${getHourlyWind(todayDate,"09")}</span>
                            <span>${getHourlyWind(todayDate,"12")}</span>
                            <span>${getHourlyWind(todayDate,"15")}</span>
                            <span>${getHourlyWind(todayDate,"18")}</span>
                        </div>
                    </div>
            
                    <div class="today-temp-summary">
                        <span>↑ ${Math.round(maxTemps[0])}°</span>
                        <span>↓ ${Math.round(minTemps[0])}°</span>
                    </div>
            
                </div>
            
            `;

            for(let i=1;i<dates.length;i++){

                const d =
                    new Date(dates[i]);

                const formattedDate =
                    `${d.getMonth()+1}/${d.getDate()} (${weekdays[d.getDay()]})`;

                const icon06 =
                    getHourlyIcon(dates[i],"06");

                const icon09 =
                    getHourlyIcon(dates[i],"09");

                const icon12 =
                    getHourlyIcon(dates[i],"12");

                const icon15 =
                    getHourlyIcon(dates[i],"15");

                const icon18 =
                    getHourlyIcon(dates[i],"18");

                const windSpeed =
                    getHourlyWind(dates[i],"12");

                const card =
                    document.createElement("div");

                card.className =
                    "weather-card";

                card.innerHTML = `

                    <div class="date">
                        ${formattedDate}
                    </div>

                    <div class="timeline">

                        <div class="time-slot">
                            <span class="time">06</span>
                            <span class="emoji">${icon06}</span>
                        </div>

                        <div class="time-slot">
                            <span class="time">09</span>
                            <span class="emoji">${icon09}</span>
                        </div>

                        <div class="time-slot">
                            <span class="time">12</span>
                            <span class="emoji">${icon12}</span>
                        </div>

                        <div class="time-slot">
                            <span class="time">15</span>
                            <span class="emoji">${icon15}</span>
                        </div>

                        <div class="time-slot">
                            <span class="time">18</span>
                            <span class="emoji">${icon18}</span>
                        </div>

                    </div>

                    <div class="temps">

                        <div class="max-temp">
                            ↑ ${Math.round(maxTemps[i])}℃
                        </div>

                        <div class="min-temp">
                            ↓ ${Math.round(minTemps[i])}℃
                        </div>

                    </div>

                    <div class="wind">
                        💨 ${windSpeed} m/s
                    </div>

                `;

                grid.appendChild(card);
            }
        }

        loadWeather();

    </script>

</body>

</html>
